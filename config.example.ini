# 跨境电商合规智能问答系统 - 配置模板
# 复制为 config.ini 并填入真实值：
#   cp config.example.ini config.ini
# 注意：config.ini 已被 .gitignore 忽略，切勿提交真实密钥。

# MySQL 配置（合规问答标准答案库）
[mysql]
host = localhost
port = 3307
user = root
password = CHANGE_ME
database = subjects_kg

# Redis 配置（热点缓存）
[redis]
host = localhost
port = 6379
password =
db = 0

# Milvus 配置（向量库）
[milvus]
host = 127.0.0.1
port = 19530
database_name = enterprise_rag
collection_name = enterprise_knowledge_chunks

# LLM 配置（阿里云 DashScope，OpenAI 兼容）
# 推荐通过环境变量 API_KEY 注入，而不是写死在这里。
[llm]
model = qwen3-max
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 日志配置
[logger]
log_file = logs/app.log

# 应用配置（跨境合规业务分类）
[app]
valid_sources = ["ce-red", "fcc", "rohs", "un38.3", "pse", "kcc"]
customer_service_phone = 12345678
