name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI smoke test only — install minimal deps to import all modules
          pip install fastapi pydantic openai requests beautifulsoup4 pymupdf

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check --select=E,F agent/ compliance/ kg/ evaluate/ rag_qa/core/ rag_qa/mineru/ || true

      - name: Import smoke test
        run: |
          python -c "import agent; import compliance; import kg; import evaluate; print('all packages importable')"

      - name: Build docs (optional)
        if: success()
        run: |
          echo "OK — agent / compliance / kg / evaluate modules import successfully"
