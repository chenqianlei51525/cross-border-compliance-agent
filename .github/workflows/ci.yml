name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax check (py_compile all modules)
        run: |
          python -m compileall -q \
            agent compliance kg evaluate \
            rag_qa/core rag_qa/mineru base mysql_qa

      - name: Verify project structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f config.example.ini
          test -f agent/agent.py
          test -f agent/tools.py
          test -f kg/__init__.py
          test -f rag_qa/core/reflective.py
          test -f rag_qa/mineru/parser.py
          test -f compliance/system.py
          test -f evaluate/pipeline.py
          echo "✅ 项目结构完整，所有核心模块语法检查通过"
